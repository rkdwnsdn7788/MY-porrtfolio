<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 교육용 안전문서 검색</title>
  <style>
    :root {
      --navy: #1F3A5F;
      --sky: #E8F1FA;
      --white: #FFFFFF;
      --text: #172033;
      --muted: #58677A;
      --line: #C9D7E6;
      --warning: #7A4D00;
      --warning-bg: #FFF8E8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--white);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 18px;
      line-height: 1.65;
    }

    .page {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    header {
      border-bottom: 3px solid var(--navy);
      padding-bottom: 24px;
      margin-bottom: 24px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      color: var(--navy);
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .subtitle { color: var(--muted); margin-bottom: 0; }

    .notice {
      background: var(--sky);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }

    .notice strong { color: var(--navy); }
    .notice p:last-child { margin-bottom: 0; }

    .search-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: var(--navy);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input, button { font: inherit; }

    input {
      width: 100%;
      min-width: 0;
      border: 2px solid #7890AB;
      border-radius: 8px;
      padding: 13px 14px;
      color: var(--text);
      background: var(--white);
    }

    input:focus {
      outline: 3px solid #BED7F0;
      outline-offset: 2px;
      border-color: var(--navy);
    }

    button {
      border: 2px solid var(--navy);
      border-radius: 8px;
      padding: 11px 20px;
      background: var(--navy);
      color: var(--white);
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #162B47; }
    button:focus-visible { outline: 3px solid #8DB9E3; outline-offset: 2px; }

    .quick-title {
      margin: 20px 0 8px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .quick-links { display: flex; flex-wrap: wrap; gap: 8px; }

    .quick-links button {
      background: var(--white);
      color: var(--navy);
      border-width: 1px;
      padding: 7px 11px;
      font-size: 0.9rem;
    }

    .quick-links button:hover { background: var(--sky); }

    .result-region {
      min-height: 120px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .result-heading { color: var(--navy); font-size: 1.45rem; }

    .query-display {
      margin-bottom: 18px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .status {
      border-radius: 8px;
      padding: 18px;
      background: var(--warning-bg);
      color: var(--warning);
      font-weight: 700;
    }

    .article-card {
      border: 1px solid var(--line);
      border-left: 6px solid var(--navy);
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 16px;
      background: var(--white);
    }

    .article-card h3 { color: var(--navy); margin-bottom: 12px; }
    .article-card ol { margin: 0; padding-left: 1.55em; }
    .article-card li + li { margin-top: 7px; }

    .source-note {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .noscript {
      border: 1px solid #C8382E;
      border-radius: 8px;
      padding: 16px;
      color: #7B1710;
    }

    @media (max-width: 600px) {
      body { font-size: 16px; }
      .page { width: min(100% - 24px, 880px); padding-top: 28px; }
      .search-panel { padding: 18px; }
      .search-row { grid-template-columns: 1fr; }
      .search-row > button { width: 100%; }
      .article-card { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>나의 교육용 안전문서 검색</h1>
      <p class="subtitle">질문에 포함된 단어로 관련 조항의 원문을 찾습니다.</p>
    </header>

    <section class="notice" aria-label="이용 안내">
      <p><strong>안내 1.</strong> 이 화면은 실제 AI 답변이 아니라, 입력한 단어와 일치하는 문서 조항 원문을 보여주는 검색 도구입니다.</p>
      <p><strong>안내 2.</strong> 이 문서는 교육용 샘플이므로 현장 판단에 사용할 수 없습니다. 현장에서는 소속 사업장의 안전관리자 지침을 따르십시오.</p>
    </section>

    <section class="search-panel" aria-labelledby="search-label">
      <form id="search-form">
        <label id="search-label" for="question">안전문서에 질문하기</label>
        <div class="search-row">
          <input id="question" name="question" type="text" autocomplete="off" placeholder="예: 고소작업 조항을 보여줘" aria-describedby="search-help">
          <button type="submit">검색</button>
        </div>
        <p id="search-help" class="quick-title">조항 제목 빠른 검색</p>
        <div id="quick-links" class="quick-links" aria-label="조항 제목 목록"></div>
      </form>
    </section>

    <section id="results" class="result-region" aria-labelledby="result-heading" aria-live="polite">
      <h2 id="result-heading" class="result-heading">검색 결과</h2>
      <p class="status">질문 입력칸에 찾고 싶은 조항의 단어를 입력해 주세요.</p>
    </section>

    <p class="source-note">자료: 「조선소 작업장 안전규정 (교육용 샘플)」 — 수업 실습에서 AI로 생성한 자료, 회사 공식 자료 아님</p>

    <noscript><p class="noscript">이 검색 화면을 사용하려면 브라우저에서 JavaScript를 허용해야 합니다.</p></noscript>
  </main>

  <script>
    const articles = [
      {
        title: "제1조 (개인보호구)",
        keywords: ["개인보호구", "보호구"],
        clauses: [
          "작업장 출입 시 안전모, 안전화, 보안경을 항상 착용한다.",
          "용접·연삭 작업 시 보안면, 방진마스크, 용접 장갑을 추가로 착용한다.",
          '보호구가 파손되거나 없는 상태로는 어떤 작업도 시작하지 않는다. "잠깐만"도 예외가 아니다.',
          "보호구가 없으면 작업을 중단하고 현장 안전관리자에게 지급을 요청한다."
        ]
      },
      {
        title: "제2조 (고소작업)",
        keywords: ["고소작업", "고소"],
        clauses: [
          "높이 2m 이상에서 작업할 때는 작업 시작 전에 안전대를 착용하고, 지정된 걸이 지점에 건다.",
          "추락 위험이 있는 개구부와 작업 발판 가장자리에는 안전난간을 먼저 설치한다.",
          "강풍(순간풍속 10m/s 이상), 강우, 강설 시 옥외 고소작업을 중지한다.",
          "사다리 위에서 용접·연삭 등 양손 작업을 하지 않는다."
        ]
      },
      {
        title: "제3조 (밀폐공간)",
        keywords: ["밀폐공간", "밀폐"],
        clauses: [
          "탱크, 이중저, 코퍼댐 등 밀폐공간에 들어가기 전에 산소농도(18~23.5%)와 유해가스 농도를 측정하고 기록한다.",
          "측정 결과가 기준을 벗어나면 환기 후 재측정하고, 기준에 들어올 때까지 출입하지 않는다.",
          "출입 전 밀폐공간 작업 허가서를 발급받고, 외부에 감시인 1명 이상을 배치한다.",
          "작업 중에도 산소농도를 계속 측정하고, 감시인은 출입구를 떠나지 않는다."
        ]
      },
      {
        title: "제4조 (용접·화기작업)",
        keywords: ["용접", "화기작업", "화기"],
        clauses: [
          "화기작업 전에 화기작업 허가서를 발급받고, 반경 10m 이내의 가연물을 제거하거나 불연 덮개로 덮는다.",
          "화기작업 중에는 화재감시자를 배치하고, 소화기를 작업 위치 3m 이내에 둔다.",
          "화재감시자는 작업 종료 후 30분간 현장을 감시한다.",
          "가스 호스와 용접 케이블의 손상 여부를 작업 전에 점검한다."
        ]
      },
      {
        title: "제5조 (크레인·중량물)",
        keywords: ["크레인", "중량물"],
        clauses: [
          "크레인으로 중량물을 인양하는 동안 인양물 아래와 반경 내에 사람이 서거나 지나가지 않는다.",
          "신호수는 1명만 지정하고, 운전자는 지정된 신호수의 신호에만 따른다.",
          "와이어로프, 슬링, 샤클은 작업 전 점검하고 손상된 것은 즉시 폐기한다.",
          "인양물의 무게가 정격 하중을 초과하면 인양하지 않는다."
        ]
      },
      {
        title: "제6조 (전기)",
        keywords: ["전기"],
        clauses: [
          "전기 설비 작업 전에 전원을 차단하고 잠금장치(LOTO)와 표지를 부착한다.",
          "젖은 손이나 젖은 장소에서 전기 기기를 다루지 않는다.",
          "피복이 벗겨진 전선과 파손된 콘센트는 사용하지 않고 즉시 신고한다.",
          "이동식 전기 기기는 누전차단기를 거쳐 사용한다."
        ]
      },
      {
        title: "제7조 (화학물질)",
        keywords: ["화학물질", "화학"],
        clauses: [
          "도료, 희석제, 세척제 등 화학물질을 다루기 전에 물질안전보건자료(MSDS)를 확인한다.",
          "화학물질을 다룰 때는 내화학 장갑과 보안경을 착용하고 환기를 유지한다.",
          "화학물질 용기에는 반드시 내용물 표시 라벨을 부착하고, 음료 용기에 옮겨 담지 않는다.",
          "피부에 닿거나 눈에 들어가면 즉시 흐르는 물로 15분 이상 씻고 보고한다."
        ]
      },
      {
        title: "제8조 (출입통제)",
        keywords: ["출입통제", "출입"],
        clauses: [
          "지정된 출입구로만 출입하고, 출입증을 항상 패용한다.",
          "위험구역(도장 중, 방사선 검사 중, 인양 중)에는 출입 표지가 있는 동안 들어가지 않는다.",
          "외부 방문자는 안전교육 이수 후 인솔자와 함께 이동한다.",
          "작업장 내에서는 지정된 보행로로 이동하고 뛰지 않는다."
        ]
      },
      {
        title: "제9조 (비상대응)",
        keywords: ["비상대응", "비상"],
        clauses: [
          "화재, 가스 누출, 추락 등 비상 상황을 발견하면 즉시 큰 소리로 알리고 비상연락번호로 신고한다.",
          "대피 방송이 나오면 작업을 멈추고 지정된 대피 경로로 집결지에 모인다.",
          "엘리베이터와 크레인은 대피에 사용하지 않는다.",
          "소화기, 비상샤워, 구급함의 위치를 작업 시작 전에 확인한다."
        ]
      },
      {
        title: "제10조 (사고보고)",
        keywords: ["사고보고", "사고", "보고"],
        clauses: [
          "부상, 아차사고, 설비 손상은 크기와 관계없이 당일 안전관리자에게 보고한다.",
          "사고 현장은 조사가 끝날 때까지 보존한다.",
          "보고 내용에는 일시, 장소, 작업 내용, 부상 부위, 목격자를 포함한다.",
          "보고자에게 불이익을 주지 않는다."
        ]
      }
    ];

    const form = document.querySelector("#search-form");
    const questionInput = document.querySelector("#question");
    const results = document.querySelector("#results");
    const quickLinks = document.querySelector("#quick-links");

    function appendTextElement(parent, tagName, className, textValue) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = textValue;
      parent.appendChild(element);
      return element;
    }

    function renderResults(rawQuestion) {
      const question = rawQuestion.trim();
      results.replaceChildren();
      appendTextElement(results, "h2", "result-heading", "검색 결과");

      if (!question) {
        appendTextElement(results, "p", "status", "질문이 모호합니다.");
        return;
      }

      appendTextElement(results, "p", "query-display", `입력한 질문: ${question}`);

      const normalized = question.toLocaleLowerCase("ko-KR").replace(/\s+/g, "");
      const matches = articles.filter((article) =>
        article.keywords.some((keyword) => normalized.includes(keyword.toLocaleLowerCase("ko-KR").replace(/\s+/g, "")))
      );

      if (matches.length === 0) {
        const vagueOnly = /^(안전|작업|규정|조항|알려줘|보여줘|어떻게|뭐야|무엇|질문)[?.!\s]*$/u.test(question);
        appendTextElement(results, "p", "status", vagueOnly ? "질문이 모호합니다." : "조항을 찾지 못했습니다.");
        return;
      }

      matches.forEach((article) => {
        const card = document.createElement("article");
        card.className = "article-card";
        appendTextElement(card, "h3", "", article.title);
        const list = document.createElement("ol");
        article.clauses.forEach((clause) => appendTextElement(list, "li", "", clause));
        card.appendChild(list);
        results.appendChild(card);
      });
    }

    articles.forEach((article) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = article.title.replace(/^제\d+조\s*/, "").replace(/[()]/g, "");
      button.addEventListener("click", () => {
        questionInput.value = button.textContent;
        renderResults(questionInput.value);
        results.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      quickLinks.appendChild(button);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      renderResults(questionInput.value);
    });
  </script>
</body>
</html>
